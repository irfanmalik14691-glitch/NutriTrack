{% extends "base.html" %}

{% block title %}Sign In | NutriTrack 3D{% endblock %}

{% block content %}
<div style="min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 20px 0;">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 36px 32px;">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <h2 class="h3 font-weight-bold text-white mb-1">Welcome Back</h2>
            <p class="text-secondary small">Sign in to your NutriTrack 3D fitness account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label" for="login_input">
                    <i class="fa-solid fa-user text-muted mr-1"></i> Username or Email
                </label>
                <input type="text" id="login_input" name="login_input" class="form-control"
                       placeholder="Enter username or email" value="{{ login_input or '' }}" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fa-solid fa-lock text-muted mr-1"></i> Password
                </label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary-glow w-100 mt-3" style="padding: 12px;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

        <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border-subtle);">
            <p class="text-secondary small mb-0">
                Don't have an account yet?
                <a href="{{ url_for('auth.register') }}" class="text-neon font-weight-bold ml-1">Create Account Free</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
