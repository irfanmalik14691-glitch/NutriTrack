{% extends "base.html" %}

{% block title %}Create Account | NutriTrack 3D{% endblock %}

{% block content %}
<div style="min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 20px 0;">
    <div class="glass-card" style="width: 100%; max-width: 460px; padding: 36px 32px;">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="h3 font-weight-bold text-white mb-1">Start Your Journey</h2>
            <p class="text-secondary small">Join NutriTrack 3D for personalized nutrition & training</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fa-solid fa-user text-muted mr-1"></i> Choose a Username
                </label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="e.g. IronAthlete" value="{{ username or '' }}" required autofocus minlength="3">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">
                    <i class="fa-solid fa-envelope text-muted mr-1"></i> Email Address
                </label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="athlete@example.com" value="{{ email or '' }}" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fa-solid fa-lock text-muted mr-1"></i> Password
                </label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Minimum 6 characters" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">
                    <i class="fa-solid fa-shield-halved text-muted mr-1"></i> Confirm Password
                </label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                       placeholder="Re-enter your password" required minlength="6">
            </div>

            <button type="submit" class="btn-primary-glow w-100 mt-3" style="padding: 12px;">
                <i class="fa-solid fa-bolt"></i> Create Free Account
            </button>
        </form>

        <div class="text-center mt-4 pt-3" style="border-top: 1px solid var(--border-subtle);">
            <p class="text-secondary small mb-0">
                Already registered?
                <a href="{{ url_for('auth.login') }}" class="text-neon font-weight-bold ml-1">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
